<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PowerSentinel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="card">

        <!-- ====================================== -->
        <!-- HEADER -->
        <!-- ====================================== -->

        <div class="header">

            <h1>⚡ PowerSentinel</h1>

            <p class="subtitle">

                Smart Power Monitoring System

            </p>

        </div>

        <!-- ====================================== -->
        <!-- TOP GRID -->
        <!-- ====================================== -->

        <div class="top-grid">

            <!-- POWER -->

            <div class="power-card">

                <div class="section-title">

                    Power Status

                </div>

                <div
                    id="power"
                    class="state">

                    UNKNOWN

                </div>

                <div
                    id="status"
                    class="status">

                    Waiting...

                </div>

                <div
                    id="countdown"
                    class="countdown">

                    IDLE

                </div>

            </div>

            <!-- DEVICE -->

            <div class="device-card">

                <div class="info">

                    <div class="info-row">

                        <span class="label">

                            ESP Status

                        </span>

                        <span id="esp">

                            ...

                        </span>

                    </div>

                    <div class="info-row">

                        <span class="label">

                            Device

                        </span>

                        <span id="device">

                            ...

                        </span>

                    </div>

                    <div class="info-row">

                        <span class="label">

                            Model

                        </span>

                        <span id="model">

                            ...

                        </span>

                    </div>

                    <div class="info-row">

                        <span class="label">

                            Firmware

                        </span>

                        <span id="firmware">

                            ...

                        </span>

                    </div>

                </div>

            </div>

        </div>

        <div class="divider"></div>

        <!-- ====================================== -->
        <!-- STATISTICS -->
        <!-- ====================================== -->

        <div class="section-title">

            Statistics

        </div>

        <div class="statistics">

            <div class="stat-card">

                <h4>

                    ⚡ Power Loss

                </h4>

                <span id="power-loss">

                    0

                </span>

            </div>

            <div class="stat-card">

                <h4>

                    🛑 Shutdown

                </h4>

                <span id="shutdown">

                    0

                </span>

            </div>

            <div class="stat-card">

                <h4>

                    📄 Events

                </h4>

                <span id="total-events">

                    0

                </span>

            </div>

        </div>

        <div class="divider"></div>

        <!-- ====================================== -->
        <!-- EVENTS -->
        <!-- ====================================== -->

        <div class="section-title">

            Recent Events

        </div>

        <div class="events-box">

            <div id="events">

                Loading...

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/status.js') }}"></script>
<script src="{{ url_for('static', filename='js/events.js') }}"></script>
<script src="{{ url_for('static', filename='js/statistics.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
